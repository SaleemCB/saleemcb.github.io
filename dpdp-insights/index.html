<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Place this file (and its /assets folder) at whatever path on
  theconceptz.com your Episodes 01-04 PDFs already link to
  (the header link on each page, e.g. theconceptz.com/dpdp-insights/).

  Catches everyone who clicks the old header link in already-shared
  PDFs and forwards them to the real hub, dpdp.conceptzee.in, without
  needing to regenerate or re-share those PDFs.
-->
<meta http-equiv="refresh" content="0; url=https://dpdp.conceptzee.in">
<title>Redirecting to DPDP Insights — ConceptZee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0E3444; --deep-2:#0A2530;
    --gold:#FFC800; --cream:#FFFEEA; --aqua:#B7E8EB; --text-lo:#8FC3C9;
    --line:rgba(183,232,235,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(1100px 700px at 82% -10%, rgba(87,187,193,0.14), transparent 55%),
      linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card{
    max-width:440px; width:100%;
    border:1px solid rgba(255,200,0,0.28);
    border-radius:4px;
    padding:40px 34px;
    text-align:center;
  }
  .logo{ width:44px; height:44px; margin-bottom:20px; }
  h1{
    font-family:'Lora',serif; font-weight:600; font-size:22px;
    color:var(--cream); margin-bottom:10px; line-height:1.4;
  }
  p{ font-size:14px; color:var(--text-lo); line-height:1.6; margin-bottom:22px; }
  .spinner{
    width:22px; height:22px; margin:0 auto 22px;
    border:2px solid rgba(255,200,0,0.25);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.manual-link{
    display:inline-block;
    color:var(--deep-2); background:var(--gold);
    font-weight:600; font-size:14px;
    text-decoration:none;
    padding:11px 22px;
    border-radius:2px;
  }
  .footer-note{ margin-top:22px; font-size:12px; color:var(--text-lo); opacity:0.7; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="ConceptZee">
    <div class="spinner"></div>
    <h1>Taking you to the new DPDP Insights hub</h1>
    <p>This link has moved to <strong>dpdp.conceptzee.in</strong>. You'll be redirected automatically in a moment.</p>
    <a class="manual-link" href="https://dpdp.conceptzee.in">Continue to dpdp.conceptzee.in</a>
    <div class="footer-note">ConceptZee &middot; Fractional DPDP Advisory for Insurance Intermediaries</div>
  </div>

  <script>
    // Immediate JS redirect; the <meta refresh> above is the fallback
    // for the rare case JS is disabled.
    window.location.replace('https://dpdp.conceptzee.in');
  </script>
</body>
</html>
